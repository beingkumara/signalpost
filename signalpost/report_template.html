<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 rx=%222%22 transform=%22rotate(45 8 8)%22 fill=%22%238a2432%22/%3E%3C/svg%3E">
<title>Signalpost · company ledger</title>
<style>
:root{
  --paper:#f4efe6;--paper-2:#ebe4d7;--card:#fffdf8;--ink:#1c1915;--ink-2:#4a443b;--muted:#6a6357;--line:#ddd4c4;--line-2:#c9bea9;
  --accent:#8a2432;--accent-ink:#fff;--accent-soft:#f3e3e3;--ok:#1d6b45;--ok-soft:#e1efe6;--warn:#8a5a00;--warn-soft:#f6ead0;
  --bad:#a3271f;--bad-soft:#f6e0dd;--na:#6c6559;--na-soft:#ece6db;--link:#1f4f7a;
  --serif:"Iowan Old Style","Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:6px;--r-md:10px;--r-lg:14px;--gap:clamp(12px,1.2vw,20px);
  --shadow:0 1px 0 rgba(28,25,21,.04),0 8px 24px -14px rgba(28,25,21,.25);
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#16140f;--paper-2:#1d1a14;--card:#211e17;--ink:#efe9dd;--ink-2:#cfc7b7;--muted:#a69d8d;--line:#3a352b;--line-2:#4b4537;
  --accent:#e0828c;--accent-ink:#1b0d0f;--accent-soft:#3a2125;--ok:#6fc496;--ok-soft:#1e3328;--warn:#e3b35a;--warn-soft:#3a3020;
  --bad:#f09088;--bad-soft:#3d2321;--na:#9a9282;--na-soft:#2a261f;--link:#8fbde6;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:170px}
@media (min-width:641px){html{scroll-padding-top:120px}}
body{margin:0;color:var(--ink);font:15px/1.5 var(--sans);background:var(--paper);
  background-image:radial-gradient(1200px 500px at 85% -10%,var(--paper-2),transparent 60%),repeating-linear-gradient(0deg,transparent 0 27px,color-mix(in srgb,var(--line) 35%,transparent) 27px 28px)}
a{color:var(--link);text-underline-offset:2px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--card);padding:8px 12px;border:1px solid var(--line);z-index:9}
.skip:focus{left:8px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

/* masthead */
.mast{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.mast-in{max-width:1400px;margin:auto;padding:12px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:26px;height:26px;background:var(--accent);transform:rotate(45deg);border-radius:4px;box-shadow:6px -6px 0 -2px var(--ink)}
.brand b{font:600 1.35rem/1 var(--serif);letter-spacing:-.01em}
.brand small{display:block;font:600 .62rem/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.search{position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.mast-stats{display:flex;gap:14px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.mast-stats b{color:var(--ink);font-weight:700}
@media (max-width:1100px){.mast-stats{display:none}}
@media (max-width:640px){.mast-in{grid-template-columns:minmax(0,1fr);gap:10px}.brand b{font-size:1.2rem}}

/* ledger strip */
.strip{max-width:1400px;margin:14px auto 0;padding:0 16px}
.strip-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.strip-in>div{padding:12px 16px;border-left:1px solid var(--line)}
.strip-in>div:first-child{border-left:0}
.kick{font:700 .64rem/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.strip-in strong{display:block;font:600 1.15rem/1.25 var(--serif);margin-top:2px}
@media (max-width:900px){.strip-in{grid-template-columns:repeat(2,minmax(0,1fr))}.strip-in>div{border-left:0;border-top:1px solid var(--line)}.strip-in>div:nth-child(-n+2){border-top:0}.strip-in>div:nth-child(2n){border-left:1px solid var(--line)}.strip-in>div:last-child{grid-column:1/-1;border-left:0}}

/* layout */
.layout{max-width:1400px;margin:auto;padding:14px 16px 48px;display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:var(--gap);align-items:start}
.layout>*{min-width:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* directory */
.dir{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column}
@media (max-width:900px){.dir{position:static;max-height:none}}
.dir-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.dir-head h2{font:600 1.5rem/1.1 var(--serif);margin:2px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.dir-head h2 span{font:600 .85rem var(--sans);color:var(--muted)}
.dir-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.dir-tools select{width:100%;padding:8px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--card);min-width:0}
.count{font-size:.78rem;color:var(--muted);margin:8px 0 0}
.list{position:relative;overflow:auto;padding:4px 0}
@media (max-width:900px){.list{max-height:60vh}}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:start;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{display:flex;justify-content:center;padding-top:15px;cursor:pointer}
.row input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.item{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px 11px 4px;border-left:3px solid transparent}
.item:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.item[aria-current=true]{background:var(--accent-soft);border-left-color:var(--accent)}
.item b{display:block;font-weight:650;font-size:.92rem;overflow-wrap:anywhere}
.item .sub{display:block;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .cov{display:flex;gap:4px;align-items:center;margin-top:6px;font-size:.7rem;color:var(--muted)}
.pip{width:18px;height:5px;border-radius:3px;background:var(--na-soft);border:1px solid var(--line)}
.pip.available{background:var(--ok);border-color:var(--ok)}
.pip.ambiguous{background:var(--warn);border-color:var(--warn)}
.pip.failed,.pip.blocked{background:var(--bad);border-color:var(--bad)}
.cmpbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-top:1px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg)}
.cmpbar small{color:var(--muted)}
.btn{padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn{white-space:nowrap;flex:none}
.btn:disabled,.btn.primary:disabled{background:var(--paper-2);border-color:var(--line-2);color:var(--muted);cursor:not-allowed}
.cmpbar small{min-width:0;line-height:1.3}
.btn.ghost{border-color:transparent;background:none;padding-left:0;color:var(--link)}

/* profile */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-height:60vh;overflow:clip}
.panel:focus{outline:none}
.enter{animation:enter .28s var(--ease) both}
@keyframes enter{from{transform:translateY(6px)}to{transform:none}}
.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
.swipe{display:none;font-size:.78rem;font-weight:600;color:var(--accent);margin:4px 0 0}
@media (max-width:640px){.swipe{display:block}}
.cmp-title{font:600 2rem/1.1 var(--serif);margin:4px 0}
[tabindex="-1"]:focus{outline:none}
@media (prefers-reduced-motion:reduce){.flash{animation:none;background:var(--accent-soft)}.enter{animation:none}html{scroll-behavior:auto}}
.hero{padding:22px clamp(16px,3vw,32px) 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--paper-2) 55%,var(--card)),var(--card))}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .kick{color:var(--accent)}
.hero h1{font:600 clamp(1.8rem,1.2rem + 2.4vw,3rem)/1.02 var(--serif);letter-spacing:-.02em;margin:6px 0 8px;overflow-wrap:anywhere}
.idline{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--ink-2);font-size:.88rem}
.idline .org{font-family:var(--mono);font-size:.84rem}
.state{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.state.bad{background:var(--bad-soft);color:var(--bad)}
.state.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:.74rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);background:var(--card)}
.chip.on{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);background:var(--ok-soft)}
.score{text-align:right;min-width:150px}
.score big{display:block;font:600 2.6rem/1 var(--serif)}
.score small{color:var(--muted);font-size:.78rem}
.score .bars{display:flex;gap:4px;justify-content:flex-end;margin-top:8px}
.score .bars span{width:22px;height:6px;border-radius:3px;background:var(--na-soft);border:1px solid var(--line)}
.score .bars span.on{background:var(--ok);border-color:var(--ok)}
@media (max-width:640px){.score{text-align:left}.score .bars{justify-content:flex-start}}
.checked{font-size:.76rem;color:var(--muted);margin-top:10px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.tile .v{font:600 1.45rem/1.15 var(--serif);margin:4px 0 2px;overflow-wrap:anywhere}
.tile .v.small{font:600 1rem/1.3 var(--sans)}
.tile .v.none{color:var(--na);font:500 .95rem/1.3 var(--sans)}
.tile .s{font-size:.74rem;color:var(--muted)}
.tile .s a{font-weight:600}
.tile.ext .kick::after{content:" · web";color:var(--accent)}

.secnav{position:sticky;top:64px;z-index:2;display:flex;gap:2px;overflow-x:auto;padding:0 clamp(8px,2vw,24px);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav a{flex:none;padding:12px 10px;font-size:.84rem;font-weight:600;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent}
.secnav a:focus-visible{outline-offset:-3px}
.secnav a:hover{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:640px){.secnav{top:108px}}
.secnav-name{flex:none;align-self:center;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 .95rem var(--serif);color:var(--ink);padding-right:12px;margin-right:4px;border-right:1px solid var(--line)}
@media (max-width:640px){.secnav-name{max-width:14ch}}
details.missing{margin-top:6px;border-bottom:1px solid var(--line)}
details.missing>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;padding:10px 0;font-size:.84rem;color:var(--muted)}
details.missing>summary::-webkit-details-marker{display:none}
details.missing>summary::before{content:"▸"/"";color:var(--accent);transition:transform var(--duration-fast,150ms) var(--ease)}
details.missing[open]>summary::before{transform:rotate(90deg)}
details.missing>summary:hover{color:var(--ink)}
.mcount{font:600 .78rem var(--mono);padding:1px 7px;border-radius:999px;background:var(--na-soft);color:var(--na)}
.mnames{flex-basis:100%;padding-left:16px;font-size:.76rem;color:var(--na);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.missing[open] .mnames{display:none}
details.missing>ul{margin:0 0 6px;padding:0 0 0 16px;list-style:none}
details.missing .claim{padding:6px 0;border-bottom:1px dashed var(--line)}
details.missing .claim:last-child{border-bottom:0}
.mreason{font-size:.8rem}
@media (prefers-reduced-motion:reduce){details.missing>summary::before{transition:none}}
.body{padding:8px clamp(16px,3vw,32px) 28px}
.brief{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:12px 0 4px}
.brief p{margin:0;padding:10px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
@media (max-width:640px){.brief p{grid-template-columns:minmax(0,1fr);gap:2px}}
.brief p b{font:700 .66rem/1.8 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.cite{font-size:.72rem;color:var(--muted);white-space:nowrap}
.cite a{font-family:var(--mono)}
section.sec{margin-top:26px;scroll-margin-top:120px}
section.sec>h2{font:600 1.35rem/1.2 var(--serif);margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font:700 .66rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--na-soft);color:var(--na)}
.badge.available,.badge.high{background:var(--ok-soft);color:var(--ok)}
.badge.ambiguous,.badge.medium{background:var(--warn-soft);color:var(--warn)}
.badge.failed,.badge.blocked{background:var(--bad-soft);color:var(--bad)}
.claim{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.claim{grid-template-columns:minmax(0,1fr);gap:2px}}
.claim:target{background:var(--accent-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:var(--r-sm)}
.label{color:var(--muted);font-size:.84rem}
.label .asof{display:block;font-size:.72rem}
.value{overflow-wrap:anywhere}
/* found values: the source link sits beside the value and only takes its own line once opened */
.claim>.value:not(.empty){display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.claim>.value>ul.entries,.claim>.value>.note,.claim>.value>details.ev[open]{flex-basis:100%}
.claim>.value>details.ev{margin-top:0}
.value.empty{color:var(--na);font-size:.88rem}
details.ev{margin-top:4px;font-size:.78rem;color:var(--muted)}
details.ev summary{cursor:pointer;color:var(--link);font-weight:600;list-style:none;display:inline-flex;gap:4px;align-items:center}
details.ev summary::-webkit-details-marker{display:none}
details.ev summary::before{content:"↗"/"";font-size:.8rem}
details.ev[open] summary{color:var(--accent)}
details.ev>div{margin-top:4px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);display:grid;gap:3px;overflow-wrap:anywhere}
ul.entries{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.entries li{padding-left:12px;border-left:2px solid var(--line-2)}
.why{display:block;color:var(--muted);font-size:.78rem}
.note{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}
.empty-state{padding:40px 24px;color:var(--muted)}
.back{display:none}
@media (max-width:900px){.back{display:inline-flex}}

/* compare */
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);margin-top:12px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem;min-width:520px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:break-word}
td{min-width:130px}
thead th{background:var(--paper-2);font:600 1rem/1.2 var(--serif);position:sticky;top:0}
thead th .org{display:block;font:500 .74rem var(--mono);color:var(--muted);white-space:nowrap}
tbody th{position:sticky;left:0;background:var(--card);color:var(--muted);font-weight:600;font-size:.8rem;min-width:120px;z-index:1}
tr.group th{background:var(--paper);color:var(--accent);font:700 .66rem/1.8 var(--sans);letter-spacing:.12em;text-transform:uppercase}
td.na{color:var(--na)}
@media (max-width:480px){tbody th{min-width:84px;max-width:96px;font-size:.74rem}th,td{padding:8px}td{min-width:118px}}
td.best{background:var(--ok-soft)}
.src{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:600}
.linkish{word-break:normal;background:none;border:0;padding:0;color:var(--link);text-decoration:underline;text-underline-offset:2px;font:inherit;text-align:left}
</style></head><body>
<a class="skip" href="#panel">Skip to company profile</a>
<header class="mast"><div class="mast-in">
  <a class="brand" href="#" aria-label="Signalpost company ledger, home"><span class="brand-mark" aria-hidden="true"></span><span><b>Signalpost</b><small>Norwegian company ledger</small></span></a>
  <div class="search" role="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <label class="visually-hidden" for="q">Search companies</label><input id="q" type="search" autocomplete="off" placeholder="Search company, org number, place or industry  ( / )"></div>
  <div class="mast-stats" id="mstats"></div>
</div></header>
<section class="strip" aria-label="About this run"><div class="strip-in" id="strip"></div></section>
<div class="layout">
  <aside class="dir" aria-labelledby="dirh">
    <div class="dir-head"><div class="kick">Company directory</div><h2 id="dirh">Companies <span id="total"></span></h2>
      <div class="dir-tools">
        <label class="visually-hidden" for="sort">Sort</label><select id="sort"><option value="data">Most data found</option><option value="name">Name A–Z</option><option value="rev">Highest revenue</option><option value="emp">Most employees</option></select>
        <label class="visually-hidden" for="f">Filter</label><select id="f"><option value="">All companies</option></select>
      </div><p class="count" id="count" aria-live="polite"></p></div>
    <nav class="list" id="list" aria-label="Companies"></nav>
    <div class="cmpbar"><small id="cmphint" role="status">Tick 2–4 companies to compare</small><button id="cmpBtn" class="btn primary" type="button" disabled>Compare (0)</button></div>
  </aside>
  <main class="panel" id="panel" tabindex="-1"></main>
  <p id="status" class="visually-hidden" role="status"></p>
</div>
<script>
const INDEX=__INDEX__;const META=__META__;
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}for(const k of kids.flat(9)){if(k==null||k===false)continue;e.append(k instanceof Node?k:document.createTextNode(String(k)))}return e}
const SECT=META.sections,SKEYS=Object.keys(SECT),MAX_CMP=4,LIMIT=300;
const nf=new Intl.NumberFormat("en");
